name: device
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  device:
    # Part 4.2 — builds and signs a development .ipa in the cloud with
    # the owner's App Store Connect API key, for USB install from the
    # 2016 Mac. Runs only on manual dispatch or a `[device]` commit.
    if: contains(github.event.head_commit.message, '[device]') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Secrets present?
        run: |
          if [ -z "${{ secrets.ASC_KEY_ID }}" ] || [ -z "${{ secrets.ASC_ISSUER_ID }}" ] || [ -z "${{ secrets.ASC_KEY_P8 }}" ] || [ -z "${{ secrets.TEAM_ID }}" ]; then
            echo "secrets not set: add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, TEAM_ID (docs/owner-steps.md)"
            exit 1
          fi

      - name: Toolchain
        run: |
          xcodebuild -version | tee ci-device-toolchain.log
          brew install xcodegen

      - name: Apply organisation id and generate project
        run: |
          bash tools/apply-org.sh
          xcodegen generate

      - name: Write the API key (never printed)
        run: |
          mkdir -p build/key
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > build/key/AuthKey.p8

      - name: Archive (automatic signing with the API key)
        run: |
          set -o pipefail
          xcodebuild archive -project SocialTimeMonitor.xcodeproj -scheme SocialTimeMonitor \
            -destination 'generic/platform=iOS' \
            -archivePath build/SocialTimeMonitor.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath build/key/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM=${{ secrets.TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            2>&1 | tee ci-device-archive.log

      - name: Export development ipa
        run: |
          set -o pipefail
          cat > build/exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/SocialTimeMonitor.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath build/key/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tee ci-device-export.log

      - name: Upload the ipa
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SocialTimeMonitor-ipa
          path: build/ipa/*.ipa
          if-no-files-found: ignore

      - name: Publish logs and status to ci-logs
        if: always()
        run: |
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir out
          cp ci-device-*.log out/ 2>/dev/null || true
          echo "device: $GITHUB_SHA ${{ job.status }} run:$GITHUB_RUN_NUMBER" >> out/STATUS.txt
          publish() {
            git clone -q --branch ci-logs --single-branch "$REPO" out_repo 2>/dev/null || { mkdir out_repo; cd out_repo; git init -q -b ci-logs; git remote add origin "$REPO"; cd ..; }
            cp out/ci-device-*.log out_repo/ 2>/dev/null || true
            cp out/STATUS.txt out_repo/
            cd out_repo
            git config user.name ci
            git config user.email ci@users.noreply.github.com
            git add -A
            git commit -qm "device logs for $GITHUB_SHA" || true
          }
          attempt=0
          until publish && git push -q origin ci-logs; do
            attempt=$((attempt+1)); [ $attempt -ge 3 ] && echo "publish failed after 3 attempts" && exit 1
            git fetch -q origin && git rebase -q origin/ci-logs || exit 1
          done
