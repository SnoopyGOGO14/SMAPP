name: screens
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screens:
    if: contains(github.event.head_commit.message, '[screens]') || contains(github.event.head_commit.message, '[screens-all]') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version | tee ci-screens-toolchain.log
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          brew install xcodegen

      - name: Cache (B4)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            build/DerivedData
          key: xcode-screens-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: xcode-screens-${{ runner.os }}-

      - name: Generate project
        run: xcodegen generate

      - name: Build app for simulator
        run: |
          set -o pipefail
          xcodebuild build -project SocialTimeMonitor.xcodeproj -scheme SocialTimeMonitor \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee ci-screens-build.log

      - name: Boot simulator and capture screenshots (self-checking)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/SocialTimeMonitor.app"
          BUNDLE="com.YOURORG.socialtimemonitor"
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-Fa-f-]{36}")
          echo "UDID=$UDID" | tee -a ci-screens-build.log
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p shots
          # W6: let the system settle after boot so no notification
          # banner lands over a capture (one did, in detail-focus4-dark).
          sleep 30
          echo "SETTLED 30s after boot" >> shots/NOTE.txt
          xcrun simctl install "$UDID" "$APP"

          # capture <expected-marker> <file-name> [extra launch args...]
          # Expected markers mirror DemoMode.markerFor: screen[/state][/period][/sheet].
          capture() {
            local expected="$1"; shift
            local name="$1"; shift
            local appearance="$1"; shift
            xcrun simctl ui "$UDID" appearance "$appearance"
            xcrun simctl terminate "$UDID" "$BUNDLE" || true
            xcrun simctl launch "$UDID" "$BUNDLE" -demo "$@" || {
              echo "LAUNCH-FAILED $name" >> shots/NOTE.txt
              return
            }
            sleep 4

            # F2: app must still be alive.
            if ! pgrep -qf "SocialTimeMonitor.app/SocialTimeMonitor"; then
              echo "CRASHED $name" >> shots/NOTE.txt
              newest=$(ls -t ~/Library/Logs/DiagnosticReports/*SocialTimeMonitor* 2>/dev/null | head -1)
              [ -n "$newest" ] && cp "$newest" "shots/crash-$name.plist" || true
              return
            fi

            # F2: the app must name the screen it is showing.
            CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data 2>/dev/null || true)
            MARKER="unreadable"
            if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/demo-screen.txt" ]; then
              MARKER=$(cat "$CONTAINER/Documents/demo-screen.txt" | tr -d '[:space:]')
            fi
            if [ "$MARKER" != "$expected" ]; then
              echo "MISMATCH $name expected=$expected marker=$MARKER" >> shots/NOTE.txt
            fi

            xcrun simctl io "$UDID" screenshot "shots/$name.png" || \
              echo "CAPTURE-FAILED $name" >> shots/NOTE.txt
            echo "$name marker=$MARKER" >> shots/NOTE.txt
          }

          # B4/A2 capture tiers: [screens] = the core set for the visual
          # review; [screens-all] (or a manual dispatch) = the full manifest.
          FULL=0
          if echo "$COMMIT_MSG" | grep -q "\[screens-all\]" || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            FULL=1
          fi

          if [ "$FULL" = "1" ]; then
          # Base screens: five screens x light and dark (08: Summary
          # replaces All apps). Expected markers mirror DemoMode.markerFor.
          for appearance in light dark; do
            capture home home-$appearance $appearance -screen home
            capture summary/weekly summary-weekly-$appearance $appearance -screen summary -period weekly
            capture summary/weekly/focus1 summary-weekly-focus1-$appearance $appearance -screen summary -period weekly -focus 1
            capture summary/daily summary-daily-$appearance $appearance -screen summary -period daily
            capture summary/monthly summary-monthly-$appearance $appearance -screen summary -period monthly
            capture detail detail-$appearance $appearance -screen detail
            capture target target-$appearance $appearance -screen target
            for card in 1 2 3 4; do
              capture onboarding onboarding-card$card-$appearance $appearance -screen onboarding -card "$card"
            done
          done

          # 08 plan section 9: Summary focus on a day bar.
          capture detail/week/focus4 detail-focus4-dark dark -screen detail -period week -focus 4

          # Part 2 states and periods (dark unless noted).
          capture home/over home-over-dark dark -screen home -state over
          capture home/comfortable home-comfortable-dark dark -screen home -state comfortable
          capture home/paused home-paused-dark dark -screen home -state paused
          capture home/noapps home-noapps-dark dark -screen home -state noapps
          capture home/notarget home-notarget-dark dark -screen home -state notarget
          capture home/noaccess home-noaccess-dark dark -screen home -state noaccess
          capture detail/today detail-today-dark dark -screen detail -period today
          capture detail/month detail-month-dark dark -screen detail -period month
          capture detail/sheet detail-sheet-dark dark -screen detail -sheet target
          capture settings settings-light light -screen settings
          capture settings settings-dark dark -screen settings

          # Large text (accessibility): check the option exists, capture
          # home and detail once more, then reset.
          xcrun simctl ui --help 2>&1 | tee -a ci-screens-build.log || true
          if xcrun simctl ui "$UDID" content_size accessibility-extra-large 2>>ci-screens-build.log; then
            capture home home-a11y-dark dark -screen home
            capture detail detail-a11y-dark dark -screen detail
            xcrun simctl ui "$UDID" content_size large || true
          else
            echo "SKIPPED large-text capture: content_size unavailable" >> shots/NOTE.txt
          fi
          else
          # Core set (09-AUDIT-AND-NEXT.md A2): light+dark for home,
          # summary weekly and detail week; dark singles for the rest.
          for appearance in light dark; do
            capture home home-$appearance $appearance -screen home
            capture summary/weekly summary-weekly-$appearance $appearance -screen summary -period weekly
            capture detail/week detail-week-$appearance $appearance -screen detail -period week
          done
          capture summary/weekly/focus1 summary-weekly-focus1-dark dark -screen summary -period weekly -focus 1
          capture summary/daily summary-daily-dark dark -screen summary -period daily
          # W1: the day pills, with a non-today pill selected.
          capture summary/daily summary-day2-dark dark -screen summary -period daily -day 2
          capture home/over home-over-dark dark -screen home -state over
          capture home/paused home-paused-dark dark -screen home -state paused
          capture detail/week/focus4 detail-focus4-dark dark -screen detail -period week -focus 4
          capture detail/month detail-month-dark dark -screen detail -period month
          capture target target-dark dark -screen target
          capture onboarding onboarding-card1-dark dark -screen onboarding -card 1
          capture onboarding onboarding-card4-dark dark -screen onboarding -card 4
          fi

          # F2: checksums; duplicates fail the job.
          dup=0
          cd shots
          for f in *.png; do
            [ -e "$f" ] || continue
            sum=$(shasum "$f" | cut -d' ' -f1)
            echo "$f checksum=$sum" >> NOTE.txt
          done
          shasum *.png | sort > /tmp/sums.txt
          awk '{print $1}' /tmp/sums.txt | uniq -d | while read -r d; do
            echo "DUPLICATE $(grep "$d" /tmp/sums.txt | cut -d' ' -f2- | tr '\n' ' ')" >> NOTE.txt
            dup=1
          done
          grep -q "^DUPLICATE" NOTE.txt && exit 1 || true
          cd ..

      - name: Publish to ci-logs/screenshots
        if: always()
        run: |
          # F7: replace only screenshots/, never the whole branch.
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          publish() {
            git clone -q --branch ci-logs --single-branch "$REPO" out_repo 2>/dev/null || { mkdir out_repo; cd out_repo; git init -q -b ci-logs; git remote add origin "$REPO"; cd ..; }
            # F9: wipe old captures first — a failed run must never leave
            # stale images that could be mistaken for new ones.
            rm -rf out_repo/screenshots
            mkdir -p out_repo/screenshots
            cp shots/* out_repo/screenshots/ 2>/dev/null || echo "no screenshots" >> out_repo/screenshots/NOTE.txt
            # B4: publish this workflow's own logs too, so a failure is
            # diagnosable from ci-logs (the 0003a8d run failed invisibly).
            cp ci-screens-*.log out_repo/ 2>/dev/null || true
            minutes=$(( ( $(date +%s) - ${JOB_START_EPOCH:-$(date +%s)} ) / 60 ))
            echo "screens: $GITHUB_SHA ${{ job.status }} ${minutes}m run:$GITHUB_RUN_NUMBER" >> out_repo/STATUS.txt
            cd out_repo
            git config user.name ci
            git config user.email ci@users.noreply.github.com
            # -A stages the copied ci-screens-*.log too (the earlier
            # version added only screenshots/STATUS and lost the logs).
            git add -A
            git commit -qm "screenshots for $GITHUB_SHA" || true
          }
          attempt=0
          until publish && git push -q origin ci-logs; do
            attempt=$((attempt+1)); [ $attempt -ge 3 ] && echo "publish failed after 3 attempts" && exit 1
            git fetch -q origin && git rebase -q origin/ci-logs || exit 1
          done
