name: build
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'design/**', 'archive/**']
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    # B4: [screens] pushes build once inside the screenshot job;
    # build.yml stays out of the way (no double build).
    if: ${{ !contains(github.event.head_commit.message, '[screens]') }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # B4: the full history of the pushed branch, so HEAD^ and
          # git diff against the previous commit work.
          fetch-depth: 2
      - name: Toolchain
        run: |
          xcodebuild -version | tee ci-toolchain.log
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          brew install xcodegen
      - name: Cache (B4)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: xcode-${{ runner.os }}-
      - name: Core tests
        run: |
          set -o pipefail
          # B4: skip when Packages/Core is unchanged since the previous
          # commit; the local pre-flight already ran them.
          if git rev-parse --verify -q HEAD^ >/dev/null \
             && git diff --quiet HEAD^ HEAD -- Packages/Core; then
            echo "Packages/Core unchanged — Core tests skipped" | tee ci-core-tests.log
          else
            swift test --package-path Packages/Core 2>&1 | tee ci-core-tests.log
          fi
      - name: Generate project
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee ci-xcodegen.log
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -project SocialTimeMonitor.xcodeproj -scheme SocialTimeMonitor \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-build-full.log

      - name: Build for device, Debug (Part 1.1)
        run: |
          set -o pipefail
          xcodebuild build -project SocialTimeMonitor.xcodeproj -scheme SocialTimeMonitor \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-device-debug.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true

      - name: Build for device, Release (Part 1.2)
        run: |
          set -o pipefail
          xcodebuild build -project SocialTimeMonitor.xcodeproj -scheme SocialTimeMonitor \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-device-release.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          # F7: share ci-logs — replace only this workflow's own files,
          # never force-push over the other workflow's results.
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir out
          cp ci-*.log out/ 2>/dev/null || true
          grep -hE "error:|warning:|BUILD (SUCCEEDED|FAILED)|Executed .* tests|Unrecognized|not found" out/*.log > out/SUMMARY.txt 2>/dev/null || true
          echo "commit: $GITHUB_SHA status: ${{ job.status }} run: $GITHUB_RUN_NUMBER" >> out/SUMMARY.txt
          if grep -q "BUILD SUCCEEDED" ci-device-debug.log 2>/dev/null; then ddbg=success; else ddbg=failure; fi
          if grep -q "BUILD SUCCEEDED" ci-device-release.log 2>/dev/null; then drel=success; else drel=failure; fi
          minutes=$(( ( $(date +%s) - ${JOB_START_EPOCH:-$(date +%s)} ) / 60 ))
          echo "build: $GITHUB_SHA ${{ job.status }} ${minutes}m run:$GITHUB_RUN_NUMBER" >> out/STATUS.txt
          echo "device-compile: $GITHUB_SHA debug=$ddbg release=$drel run:$GITHUB_RUN_NUMBER" >> out/STATUS.txt
          publish() {
            git clone -q --branch ci-logs --single-branch "$REPO" out_repo 2>/dev/null || { mkdir out_repo; cd out_repo; git init -q -b ci-logs; git remote add origin "$REPO"; cd ..; }
            mkdir -p out_repo
            cp out/ci-*.log out_repo/ 2>/dev/null || true
            cp out/SUMMARY.txt out/STATUS.txt out_repo/
            cd out_repo
            git config user.name ci
            git config user.email ci@users.noreply.github.com
            git add .
            git commit -qm "build logs for $GITHUB_SHA" || true
          }
          attempt=0
          until publish && git push -q origin ci-logs; do
            attempt=$((attempt+1)); [ $attempt -ge 3 ] && echo "publish failed after 3 attempts" && exit 1
            git fetch -q origin && git rebase -q origin/ci-logs || exit 1
          done
