# Social Time Monitor — XcodeGen project definition
# Session 0 scaffold. Replace YOURORG once (here and in the .entitlements files),
# after registering the bundle IDs and App Group in the Apple Developer portal.
# Generate with: xcodegen generate

name: SocialTimeMonitor
options:
  bundleIdPrefix: com.YOURORG
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.4"

packages:
  Core:
    path: Packages/Core

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SocialTimeMonitor:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - App
      - Shared
      - SharedUI
    dependencies:
      - package: Core
      - target: UsageReport
      - target: UsageMonitor
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Social Time Monitor
        UILaunchScreen:
          UIColorName: Ground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.YOURORG.socialtimemonitor
    entitlements:
      path: Config/SocialTimeMonitor.entitlements

  UsageReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - UsageReport
      - Shared
      - SharedUI
    dependencies:
      - package: Core
    info:
      path: Config/UsageReport-Info.plist
      properties:
        CFBundleDisplayName: UsageReport
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: Config/UsageReport.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.YOURORG.socialtimemonitor.UsageReport
        # ExtensionKit extension: skip the classic extension lifecycle check
        ENABLE_EMBEDDED_CONTENT_PLUGINS: YES

  UsageMonitor:
    type: app-extension
    platform: iOS
    sources:
      - UsageMonitor
      - Shared/SharedSettings.swift
    dependencies:
      - package: Core
    info:
      path: Config/UsageMonitor-Info.plist
      properties:
        CFBundleDisplayName: UsageMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).UsageMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.YOURORG.socialtimemonitor.UsageMonitor
    entitlements:
      path: Config/UsageMonitor.entitlements

# Note (Session 0): if XcodeGen rejects `app-extension` for the report
# extension, try type `extension-kit-extension` and record the change in
# PROGRESS.md. Apple's own template (File > New > Target > Device Activity
# Report Extension) is the authority on these plist keys.
