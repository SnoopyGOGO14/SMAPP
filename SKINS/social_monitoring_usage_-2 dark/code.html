<!-- BEGIN: InteractiveTabLogic -->
<script data-purpose="timeframe-interaction">
  document.addEventListener('DOMContentLoaded', () => {
    const statsData = {
      daily: {
        label: 'Daily Usage',
        total: '14.2 hrs',
        topApp: 'TIKTOK 5.3 HRS',
        items: {
          tiktok: '5.3 hrs',
          whatsapp: '4.1 hrs',
          facebook: '2.7 hrs',
          youtube: '1.1 hrs',
          x: '0.9 hrs',
          instagram: '0.1 hrs'
        }
      },
      weekly: {
        label: 'Weekly Usage',
        total: '99.5 hrs',
        topApp: 'TIKTOK 37 HRS',
        items: {
          tiktok: '37 hrs',
          whatsapp: '29 hrs',
          facebook: '19 hrs',
          youtube: '8 hrs',
          x: '6 hrs',
          instagram: '0.5 hrs'
        }
      },
      monthly: {
        label: 'Monthly Usage',
        total: '398 hrs',
        topApp: 'TIKTOK 148 HRS',
        items: {
          tiktok: '148 hrs',
          whatsapp: '116 hrs',
          facebook: '76 hrs',
          youtube: '32 hrs',
          x: '24 hrs',
          instagram: '2 hrs'
        }
      },
      yearly: {
        label: 'Yearly Share',
        total: '100%',
        topApp: 'TOP: TIKTOK (37%)',
        items: {
          tiktok: '37.2%',
          whatsapp: '29.1%',
          facebook: '19.1%',
          youtube: '8.0%',
          x: '6.0%',
          instagram: '0.6%'
        }
      }
    };

    let currentPeriod = 'weekly';
    let lockedApp = null;     // Keeps selection if clicked
    let hoveredApp = null;    // Tracks current hover

    const segmentGeometries = {
      tiktok: { dash: '186.9 502.65', offset: '0', name: 'TikTok', color: '#ff2d20' },
      whatsapp: { dash: '146.5 502.65', offset: '-186.9', name: 'WhatsApp', color: '#0d9488' },
      facebook: { dash: '96.0 502.65', offset: '-333.4', name: 'Facebook', color: '#2563eb' },
      youtube: { dash: '40.4 502.65', offset: '-429.4', name: 'YouTube', color: '#facc15' },
      x: { dash: '30.3 502.65', offset: '-469.8', name: 'X', color: '#7c3aed' },
      instagram: { dash: '3.2 502.65', offset: '-500.1', name: 'Instagram', color: '#ec4899' }
    };

    const tabs = document.querySelectorAll('.time-tab');
    const centerPeriodLabel = document.getElementById('centerPeriodLabel');
    const centerTotal = document.getElementById('centerTotal');
    const centerTopApp = document.getElementById('centerTopApp');
    const weeklyProgress = document.getElementById('weeklyProgress');
    const goldHighlightSeg = document.getElementById('goldHighlightSeg');
    const appRows = document.querySelectorAll('.app-row');
    const donutSegments = document.querySelectorAll('.donut-seg');

    function renderActiveState(appKey) {
      if (!appKey || !segmentGeometries[appKey]) {
        // Reset to default total state
        goldHighlightSeg.classList.remove('gold-highlight-active');
        goldHighlightSeg.classList.add('opacity-0');
        goldHighlightSeg.setAttribute('stroke-dasharray', '0 502.65');

        donutSegments.forEach(seg => {
          seg.classList.remove('chart-dimmed', 'chart-segment-active');
        });

        appRows.forEach(row => {
          row.classList.remove('app-card-active');
        });

        const data = statsData[currentPeriod];
        centerPeriodLabel.textContent = data.label.toUpperCase();
        centerPeriodLabel.classList.remove('text-[#ffd700]');
        centerPeriodLabel.classList.add('text-[#a1a1aa]');
        centerTotal.textContent = data.total;
        centerTopApp.textContent = data.topApp;
        centerTopApp.style.color = '#ff2d20';
        return;
      }

      const geom = segmentGeometries[appKey];
      const appVal = statsData[currentPeriod].items[appKey] || '';

      // Highlight segment with outlined gold stroke and subtle glow
      goldHighlightSeg.setAttribute('stroke', '#FFD700');
      goldHighlightSeg.setAttribute('stroke-dasharray', geom.dash);
      goldHighlightSeg.setAttribute('stroke-dashoffset', geom.offset);
      goldHighlightSeg.classList.remove('opacity-0');
      goldHighlightSeg.classList.add('gold-highlight-active');

      // Dim other segments, keep active bright
      donutSegments.forEach(seg => {
        if (seg.dataset.app === appKey) {
          seg.classList.remove('chart-dimmed');
          seg.classList.add('chart-segment-active');
        } else {
          seg.classList.add('chart-dimmed');
          seg.classList.remove('chart-segment-active');
        }
      });

      // Highlight matching row card
      appRows.forEach(row => {
        if (row.dataset.app === appKey) {
          row.classList.add('app-card-active');
        } else {
          row.classList.remove('app-card-active');
        }
      });

      // Update Center text to show selected app name and hours/usage
      centerPeriodLabel.textContent = geom.name.toUpperCase();
      centerPeriodLabel.classList.remove('text-[#a1a1aa]');
      centerPeriodLabel.classList.add('text-[#ffd700]');

      centerTotal.textContent = appVal;
      centerTopApp.textContent = `${geom.name.toUpperCase()} ${appVal.toUpperCase()}`;
      centerTopApp.style.color = '#ffd700';
    }

    function handleEnter(app) {
      hoveredApp = app;
      renderActiveState(app);
    }

    function handleLeave() {
      hoveredApp = null;
      if (lockedApp) {
        renderActiveState(lockedApp);
      } else {
        renderActiveState(null);
      }
    }

    function handleClick(app, e) {
      if (e) e.stopPropagation();
      if (lockedApp === app) {
        lockedApp = null;
        renderActiveState(hoveredApp || null);
      } else {
        lockedApp = app;
        renderActiveState(lockedApp);
      }
    }

    // Attach listeners to App Rows
    appRows.forEach(row => {
      const app = row.dataset.app;
      row.addEventListener('mouseenter', () => handleEnter(app));
      row.addEventListener('mouseleave', handleLeave);
      row.addEventListener('click', (e) => handleClick(app, e));
      row.addEventListener('touchstart', (e) => {
        // Handle touch on mobile cleanly
        handleClick(app, e);
      }, { passive: true });
    });

    // Attach listeners to Donut Slices
    donutSegments.forEach(seg => {
      const app = seg.dataset.app;
      seg.addEventListener('mouseenter', () => handleEnter(app));
      seg.addEventListener('mouseleave', handleLeave);
      seg.addEventListener('click', (e) => handleClick(app, e));
      seg.addEventListener('touchstart', (e) => {
        handleClick(app, e);
      }, { passive: true });
    });

    // Clicking anywhere outside clears lock and restores default
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.app-row') && !e.target.closest('#donutSvg')) {
        lockedApp = null;
        renderActiveState(null);
      }
    });

    // Time tabs handler
    tabs.forEach(tab => {
      tab.addEventListener('click', (e) => {
        e.stopPropagation();
        const period = tab.dataset.period;
        const data = statsData[period];
        if (!data) return;
        currentPeriod = period;

        // Reset tab styles
        tabs.forEach(t => {
          t.classList.remove('text-white', 'font-bold');
          t.classList.add('text-[#71717a]', 'font-semibold');
        });

        // Activate clicked tab
        tab.classList.remove('text-[#71717a]');
        tab.classList.add('text-white', 'font-bold');

        // Manage Weekly underline bar opacity
        if (period === 'weekly') {
          weeklyProgress.classList.remove('opacity-20');
          weeklyProgress.classList.add('opacity-100');
        } else {
          weeklyProgress.classList.remove('opacity-100');
          weeklyProgress.classList.add('opacity-20');
        }

        // Update Legend Grid Card Values
        Object.keys(data.items).forEach(key => {
          const el = document.getElementById(`val-${key}`);
          if (el) el.textContent = data.items[key];
        });

        // Refresh view with current selection or reset
        renderActiveState(lockedApp || hoveredApp || null);
      });
    });

    // Initialize with default state
    renderActiveState(null);
  });
</script>
<!-- END: InteractiveTabLogic -->
</body></html>
