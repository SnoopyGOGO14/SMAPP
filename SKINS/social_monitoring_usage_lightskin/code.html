<script data-purpose="timeframe-interaction">
    const statsData = {
      daily: {
        label: 'Daily Usage',
        total: '14.2 hrs',
        topApp: 'TikTok 5.3 hrs',
        items: {
          tiktok: '5.3 hrs',
          whatsapp: '4.1 hrs',
          facebook: '2.7 hrs',
          youtube: '1.1 hrs',
          x: '0.9 hrs',
          instagram: '0.1 hrs'
        }
      },
      weekly: {
        label: 'Weekly Usage',
        total: '99.5 hrs',
        topApp: 'TikTok 37 hrs',
        items: {
          tiktok: '37 hrs',
          whatsapp: '29 hrs',
          facebook: '19 hrs',
          youtube: '8 hrs',
          x: '6 hrs',
          instagram: '0.5 hrs'
        }
      },
      monthly: {
        label: 'Monthly Usage',
        total: '398 hrs',
        topApp: '37% of Monthly',
        items: {
          tiktok: '37%',
          whatsapp: '29%',
          facebook: '19%',
          youtube: '8%',
          x: '6%',
          instagram: '1%'
        }
      },
      yearly: {
        label: 'Yearly Share',
        total: '100%',
        topApp: 'Top: TikTok (37%)',
        items: {
          tiktok: '37.2%',
          whatsapp: '29.1%',
          facebook: '19.1%',
          youtube: '8.0%',
          x: '6.0%',
          instagram: '0.6%'
        }
      }
    };

    let currentPeriod = 'weekly';
    let activeAppKey = null;

    const segmentGeometries = {
      tiktok: { dash: '186.9 502.65', offset: '0', name: 'TikTok' },
      whatsapp: { dash: '146.5 502.65', offset: '-186.9', name: 'WhatsApp' },
      facebook: { dash: '96.0 502.65', offset: '-333.4', name: 'Facebook' },
      youtube: { dash: '40.4 502.65', offset: '-429.4', name: 'YouTube' },
      x: { dash: '30.3 502.65', offset: '-469.8', name: 'X' },
      instagram: { dash: '2.55 502.65', offset: '-500.1', name: 'Instagram' }
    };

    const tabs = document.querySelectorAll('.time-tab');
    const centerPeriodLabel = document.getElementById('centerPeriodLabel');
    const centerTotal = document.getElementById('centerTotal');
    const centerTopApp = document.getElementById('centerTopApp');
    const weeklyProgress = document.getElementById('weeklyProgress');
    const goldHighlightSeg = document.getElementById('goldHighlightSeg');
    const appRows = document.querySelectorAll('.app-row');
    const donutSegments = document.querySelectorAll('.donut-seg');

    function highlightApp(appKey) {
      if (!appKey || !segmentGeometries[appKey]) {
        clearHighlight();
        return;
      }
      activeAppKey = appKey;
      const geom = segmentGeometries[appKey];

      // Highlight segment with warm amber/gold border overlay
      goldHighlightSeg.setAttribute('stroke-dasharray', geom.dash);
      goldHighlightSeg.setAttribute('stroke-dashoffset', geom.offset);
      goldHighlightSeg.classList.remove('opacity-0');
      goldHighlightSeg.classList.add('opacity-100');

      // Dim other donut segments slightly
      donutSegments.forEach(seg => {
        if (seg.dataset.app === appKey) {
          seg.classList.remove('chart-dimmed');
          seg.classList.add('chart-segment-active');
        } else {
          seg.classList.add('chart-dimmed');
          seg.classList.remove('chart-segment-active');
        }
      });

      // Highlight App Row card with subtle gold border and elevation
      appRows.forEach(row => {
        if (row.dataset.app === appKey) {
          row.classList.add('app-card-active');
        } else {
          row.classList.remove('app-card-active');
        }
      });

      // Update Center text to focus on this app's stat
      const appVal = statsData[currentPeriod].items[appKey] || '';
      centerPeriodLabel.textContent = geom.name;
      centerPeriodLabel.classList.add('text-amber-700');
      centerPeriodLabel.classList.remove('text-stone-500');
      centerTotal.textContent = appVal;
      centerTopApp.textContent = `${statsData[currentPeriod].label} Share`;
      centerTopApp.classList.add('text-amber-700');
      centerTopApp.classList.remove('text-sky-700');
    }

    function clearHighlight() {
      activeAppKey = null;
      goldHighlightSeg.classList.remove('opacity-100');
      goldHighlightSeg.classList.add('opacity-0');

      donutSegments.forEach(seg => {
        seg.classList.remove('chart-dimmed', 'chart-segment-active');
      });

      appRows.forEach(row => {
        row.classList.remove('app-card-active');
      });

      // Restore central summary
      const data = statsData[currentPeriod];
      centerPeriodLabel.textContent = data.label;
      centerPeriodLabel.classList.remove('text-amber-700');
      centerPeriodLabel.classList.add('text-stone-500');
      centerTotal.textContent = data.total;
      centerTopApp.textContent = data.topApp;
      centerTopApp.classList.remove('text-amber-700');
      centerTopApp.classList.add('text-sky-700');
    }

    // Attach listeners to App Rows
    appRows.forEach(row => {
      const app = row.dataset.app;
      row.addEventListener('mouseenter', () => highlightApp(app));
      row.addEventListener('mouseleave', () => {
        if (activeAppKey === app) clearHighlight();
      });
      row.addEventListener('click', (e) => {
        e.stopPropagation();
        if (activeAppKey === app) {
          clearHighlight();
        } else {
          highlightApp(app);
        }
      });
    });

    // Attach listeners to Donut Slices
    donutSegments.forEach(seg => {
      const app = seg.dataset.app;
      seg.addEventListener('mouseenter', () => highlightApp(app));
      seg.addEventListener('mouseleave', () => {
        if (activeAppKey === app) clearHighlight();
      });
      seg.addEventListener('click', (e) => {
        e.stopPropagation();
        if (activeAppKey === app) {
          clearHighlight();
        } else {
          highlightApp(app);
        }
      });
    });

    // Dismiss active highlight on outer tap
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.app-row') && !e.target.closest('#donutSvg')) {
        clearHighlight();
      }
    });

    // Time tabs handler
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const period = tab.dataset.period;
        const data = statsData[period];
        if (!data) return;
        currentPeriod = period;

        // Reset tab styles
        tabs.forEach(t => {
          t.classList.remove('text-neutral-900', 'font-bold');
          t.classList.add('text-stone-400');
        });

        // Activate clicked tab
        tab.classList.remove('text-stone-400');
        tab.classList.add('text-neutral-900', 'font-bold');

        // Manage Weekly 50% progress bar visibility/opacity
        if (period === 'weekly') {
          weeklyProgress.classList.remove('opacity-25');
          weeklyProgress.classList.add('opacity-100');
        } else {
          weeklyProgress.classList.remove('opacity-100');
          weeklyProgress.classList.add('opacity-25');
        }

        // Update Legend Grid Card Values
        Object.keys(data.items).forEach(key => {
          const el = document.getElementById(`val-${key}`);
          if (el) el.textContent = data.items[key];
        });

        // Reset or refresh central highlights
        if (activeAppKey) {
          highlightApp(activeAppKey);
        } else {
          clearHighlight();
        }
      });
    });
  </script>
<!-- END: InteractiveTabLogic -->
</body></html>
